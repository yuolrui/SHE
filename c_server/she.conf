###################################################################
# SHE (Secure HTTP Engine) Configuration File: she.conf
###################################################################

## Core Server Bindings
server.port = 8899
server.bind = "0.0.0.0"
server.document-root = "./www"
server.tag = "SHE/1.0 (Secure HTTP Engine)"
server.max-connections = 1024
server.keepalive-timeout = 15
server.max-keepalive-requests = 100
server.workers = 1

## Security Subsystem (she_security)
security.rate-limit-enable = 1
security.rate-limit-rate = 40.0
security.rate-limit-burst = 30.0
security.enable-headers = 1
security.strict-host-check = 1

## HTTP Basic Authentication (mod_auth - RFC 7617)
auth.enable = 1
auth.path = "/secure/"
auth.user = "admin"
auth.password = "she_secret123"

## Virtual Host Routing (mod_vhost)
vhost.enable = 1
vhost.map = "docs.local:./www/docs,api.local:./www/api,secure.local:./www/secure"

## Dynamic HTTP Compression (mod_deflate - RFC 1952)
deflate.enable = 1
deflate.min-size = 128

## URL Rewriting & HTTP 301/302 Redirection (mod_rewrite)
rewrite.enable = 1
rewrite.rules = "/old-docs=>/docs/index.html"
redirect.rules = "/legacy=>301:/index.html,/guide=>302:/docs/"

## Reverse Proxy Gateway (mod_proxy)
proxy.enable = 1
proxy.path = "/proxy"
proxy.backend = "127.0.0.1:3000"

## RFC 6455 WebSocket Handshake Engine (mod_websocket)
websocket.enable = 1
websocket.path = "/ws"

## TLS 1.3 Transport Security & ALPN (mod_ssl)
ssl.enable = 1
ssl.min-version = "TLSv1.2"
ssl.preferred-version = "TLSv1.3"

## HTTP/2 Binary Framing & Multiplexing (mod_http2 - RFC 9113)
http2.enable = 1
http2.max-concurrent-streams = 100
http2.initial-window-size = 65535

## WebAssembly Edge Function Engine (mod_wasm)
wasm.enable = 1
wasm.path = "/edge"
wasm.memory-limit = 65536
wasm.max-instances = 16

## eBPF / XDP Kernel Packet Acceleration & DDoS Shield (mod_ebpf)
ebpf.enable = 1
ebpf.xdp-mode = "native"
ebpf.syn-flood-threshold = 500
ebpf.block-private-ranges = 0

## Automated Certificate Management Environment (mod_acme - RFC 8555)
acme.enable = 1
acme.directory = "https://acme-v02.api.letsencrypt.org/directory"
acme.challenge-path = "/.well-known/acme-challenge"
acme.auto-renew-days = 30

## RFC 9000 QUIC Transport & RFC 9114 HTTP/3 (mod_quic)
quic.enable = 1
quic.port = 8899
quic.qpack-max-table = 4096
quic.alt-svc = "h3=\":8899\"; ma=86400, h3-29=\":8899\"; ma=86400"

## Zero-Trust Noise Protocol VPN & WireGuard Mesh (mod_wireguard)
wireguard.enable = 1
wireguard.interface = "she-wg0"
wireguard.port = 51820
wireguard.interface-ip = "10.42.0.1/24"

## gRPC / Protocol Buffers Binary Transcoder (mod_grpc)
grpc.enable = 1
grpc.transcode = 1
grpc.compression = "gzip"
